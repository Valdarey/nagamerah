[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="nagamerah"
version="1.0.0"
description="Threat Intelligence Aggregator & IOC Enrichment CLI Tool"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["typer>=0.12","rich>=13","httpx>=0.27","pydantic>=2","dnspython>=2.6","tomli>=2; python_version < '3.11'","tomli-w>=1"]
[project.optional-dependencies]
dev=["pytest>=8","pytest-cov>=5","ruff>=0.5"]
[project.scripts]
nagamerah="nagamerah.cli:app"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py310"
